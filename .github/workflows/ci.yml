name: CI
on:
  push:
jobs:
Build:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Set up JDK
      uses: joschi/setup-jdk@v2.3.0
      with:
        distribution: temurin
        java-version: 17
    - name: Run Gradle Build
      run: ./gradlew clean build